# Deployed configuration (Mac Mini). Activated by deployment/start-pbs.sh.
#
# This file is TRACKED in git and must never hold secrets — those stay in deployment/pbs.env on the deploy machine
# and reach the app as environment variables.
#
# The profile exists so that deployment-only behaviour can be gated POSITIVELY — @Profile("production") and
# <springProfile name="production"> — rather than by a negation list naming every development profile.

spring.main.banner-mode=off

# Logging to file. FOLDER_BASE is exported by deployment/start-pbs.sh and is the deployment directory, so this
# resolves to the same path `just logs` tails. The `.` fallback keeps a jar started by hand from failing outright.
#
# Setting logging.file.name is what activates the FILE appender: logback-spring.xml imports Boot's
# file-appender.xml, which reads LOG_FILE — derived from this property.
#
# The file name and Boot's default pattern are a contract with the log-retention stack on the Mini, which follows
# exactly this file and parses exactly this line format. See "Infrastructure" in CLAUDE.md before changing either.
logging.file.name=${FOLDER_BASE:.}/logs/pbs.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Canned for now (2026-10-29), while the owner tries the GUI: uploads are answered with the recordings below, at no
# cost. Remove this line to parse with Claude again (see Status in CLAUDE.md).
pbs.receipt-parser=canned

# Beside the logs, in the deployment directory (FOLDER_BASE, as above), so that `mvn clean` cannot touch them.
pbs.recording-dir=${FOLDER_BASE:.}/recordings

# Caddy forwards plain HTTP. Without this, Spring builds http:// URLs, which breaks the OAuth2 redirect URI.
server.forward-headers-strategy=native

# Caddy on the same machine is the only legitimate client. Bound to every interface, anything on the LAN could
# reach the app directly, skipping Cloudflare — and since Tomcat trusts X-Forwarded-* headers from
# private-network addresses by default, it could also claim to be HTTPS.
server.address=127.0.0.1
