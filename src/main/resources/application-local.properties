# Development on the dev machine: -Dspring.profiles.active=local.
#
# This file is TRACKED in git and must never hold secrets. Those go in local-secrets.properties in the project root
# (gitignored), copied from local-secrets.properties.example. It is read from the working directory, which is the
# project root both from IntelliJ and for `mvn spring-boot:run`.
spring.config.import=optional:file:./local-secrets.properties

# The OpenAPI spec and Swagger UI, for `npm run generate-api` (see frontend/openapi-config.cjs). Local only.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Answer uploads with the recordings in recordings/ rather than calling Claude. Switch to `claude` to make new ones;
# that needs ANTHROPIC_API_KEY in local-secrets.properties. The hand-written test receipts are a start:
#   mkdir -p recordings && cp src/test/resources/recordings/*.json recordings/
pbs.receipt-parser=canned
