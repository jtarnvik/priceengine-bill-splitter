# Also supplies the [pbs] bracket in every log line, which the log-retention parser on the Mini expects.
spring.application.name=pbs

# The build's version, filled in by Maven: Spring Boot's parent pom replaces @...@ in application*.properties. The
# stream tells every page this on connect, so that a page left open across a deploy reloads itself.
pbs.version=@project.version@

# 8082 in every profile: overlord holds 8080 and publicbackend 8081 on the Mini, and keeping the same port in
# development lets all three run side by side on the dev machine too.
server.port=8082

# Google OAuth2. pbs's own client, not the commuter app's. The values come from the environment (deployment/pbs.env
# on the Mini, local-secrets.properties in development), never from a tracked file: the repository is public.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# The single Google account admitted. Google lets any account through (the consent screen's project is in
# production), so OwnerOnlyOidcUserService comparing against this is the only gate.
pbs.allowed-email=${PBS_ALLOWED_EMAIL}

# Explicit, because a cookie without SameSite is treated differently by different browsers, and leaving CSRF
# disabled is defensible only because Lax keeps a cross-site POST from carrying the cookie.
server.servlet.session.cookie.same-site=lax

# springdoc is off here and on in `local` only: the app is on the public internet, and /v3/api-docs plus Swagger UI
# would publish the whole API surface. `local` is the only place code generation runs.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.packages-to-scan=com.tarnvik.pbs.port.incoming.rest
springdoc.paths-to-match=/api/**

# The people who share the bill at startup, by first name, in the order the pages show them; two to four, each once.
# First names only: the repository is public. The owner changes them in the app's settings, until the next restart.
pbs.participants=Jesper,Anders,Anna,Kia
# The participant who paid the bill: they get no Swish button. One of pbs.participants; changeable in the settings.
pbs.payee=Jesper
# The payee's Swish number, for the payment links. From the environment, never a tracked file: the repository is
# public. Sent to the pages only while a split is marked done; never logged.
pbs.swish-number=${PBS_SWISH_NUMBER}
# A receipt untouched this long is reset, number and all, so that a forgotten reset does not leave the number on a
# public page. Checked every minute.
pbs.receipt-expiry=30m

# Receipt parsing, the parser at startup: `claude` calls the API and records every parse; `canned` answers with those
# recordings instead, one after another, at no cost (see CannedReceiptParser). The owner switches between them in the
# app's settings, in memory until the next restart. `canned` in every profile until 1.0, which makes it `claude`.
pbs.receipt-parser=canned
# pbs's own key, from the environment like the Google values. Needed at startup in every profile: both parsers always
# exist, so that the owner can switch between them.
pbs.anthropic-api-key=${ANTHROPIC_API_KEY}
# Relative to the working directory: the project root in development. Gitignored, and never committed: a folder of
# receipts says where the owner eats.
pbs.recording-dir=recordings
pbs.canned-parser-delay=1s

# The browser downscales a photo to well under 2 MB; this is headroom over Spring's 1 MB default.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
