# Dummy values, so that the context starts in tests; nothing here ever reaches Google.
GOOGLE_CLIENT_ID=test-client-id
GOOGLE_CLIENT_SECRET=test-client-secret
PBS_ALLOWED_EMAIL=owner@example.com
# No test calls the real API. The canned parser answers with the hand-written receipts, without its pause.
pbs.receipt-parser=canned
pbs.recording-dir=src/test/resources/recordings
pbs.canned-parser-delay=0s
